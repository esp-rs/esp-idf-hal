name: CIEspIdfNext

on:
  push:
    branches:
      - master
  schedule:
    - cron: "50 5 * * *"
  workflow_dispatch:

# A new run for the same branch or PR cancels the one still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  rust_toolchain: nightly
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Compile-time configuration of the networking examples
  WIFI_SSID: "ssid"
  WIFI_PASS: "pass"
  ESP_DEVICE_IP: "192.168.1.250"
  GATEWAY_IP: "192.168.1.1"
  GATEWAY_NETMASK: "24"

jobs:
  compile:
    name: "${{ matrix.target }} / ${{ matrix.idf-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv32imc-esp-espidf
          - riscv32imac-esp-espidf
          - riscv32imafc-esp-espidf
          - xtensa-esp32-espidf
          - xtensa-esp32s2-espidf
          - xtensa-esp32s3-espidf
        idf-version:
#          - release/v6.2
          - master
    env:
      ESP_IDF_VERSION: ${{ matrix.idf-version }}
      RUSTFLAGS: "--cfg espidf_time64"
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v3

      # A CI cell builds ESP-IDF twice (the std and no_std variants of esp-idf-sys differ in
      # features, hence in build-script output directory) and links all examples, which
      # does not fit next to the pre-installed toolchains of the runner image
      - name: Setup | Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          df -h /

      # The toolchains are installed by hand rather than with the dtolnay/rust-toolchain and
      # esp-rs/xtensa-toolchain actions, so that their downloads can be retried: they fail
      # now and then on a reset connection, and composite actions cannot be wrapped in a retry
      - name: Setup | Rust
        if: matrix.target == 'riscv32imc-esp-espidf'
        run: |
          .github/retry.sh rustup toolchain install ${{ env.rust_toolchain }} --profile minimal --component rustfmt,clippy,rust-src
          rustup default ${{ env.rust_toolchain }}

      - name: Setup | Rust for Xtensa
        if: matrix.target != 'riscv32imc-esp-espidf'
        run: |
          host=$(rustup show | grep "Default host" | sed -e 's/.* //')
          .github/retry.sh curl -sSfL https://github.com/esp-rs/espup/releases/latest/download/espup-$host.zip -o espup.zip
          unzip -o espup.zip -d "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/espup"
          # A failed install must not leave a partial toolchain behind for the next attempt to skip
          export ESPUP_EXPORT_FILE="$HOME/exports"
          for attempt in 1 2 3; do
            rm -rf "$HOME/.rustup/toolchains/esp"
            "$HOME/.cargo/bin/espup" install -l debug --targets esp32,esp32s2,esp32s3 && break
            [ "$attempt" -lt 3 ] && { echo "::warning::espup install attempt $attempt failed; retrying in 20s"; sleep 20; } || exit 1
          done
          source "$ESPUP_EXPORT_FILE"
          echo "$PATH" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=${LIBCLANG_PATH}" >> "$GITHUB_ENV"
          echo "CLANG_PATH=${CLANG_PATH}" >> "$GITHUB_ENV"
          rustup default esp

      - name: Setup | ldproxy
        run: |
          .github/retry.sh curl -sSfL https://github.com/esp-rs/embuild/releases/latest/download/ldproxy-x86_64-unknown-linux-gnu.zip -o $HOME/.cargo/bin/ldproxy.zip
          unzip "$HOME/.cargo/bin/ldproxy.zip" -d "$HOME/.cargo/bin/"
          chmod a+x $HOME/.cargo/bin/ldproxy

      - name: Build | Fmt Check
        run: cargo fmt --all -- --check

      # The examples package depends on the three crates with their full feature set, so a single
      # workspace-wide invocation lints/compiles every crate and every example with all features on
      - name: Build | Clippy, all crates and examples
        run: cargo clippy --workspace --examples --no-deps --target ${{ matrix.target }} -Zbuild-std=std,panic_abort -- -Dwarnings

      - name: Build | Compile, all crates and examples
        run: cargo build --workspace --examples --target ${{ matrix.target }} -Zbuild-std=std,panic_abort

      # Only the three crates are selected here: the examples need `std`
      - name: Build | Compile, no_std
        run: cargo build -p esp-idf-sys -p esp-idf-hal -p esp-idf-svc --no-default-features --features esp-idf-hal/experimental,esp-idf-svc/nightly,esp-idf-svc/experimental --target ${{ matrix.target }} -Zbuild-std=std,panic_abort

      - name: Build | Compile, no_std, alloc
        run: cargo build -p esp-idf-sys -p esp-idf-hal -p esp-idf-svc --no-default-features --features esp-idf-hal/alloc,esp-idf-hal/experimental,esp-idf-svc/alloc,esp-idf-svc/nightly,esp-idf-svc/experimental --target ${{ matrix.target }} -Zbuild-std=std,panic_abort
