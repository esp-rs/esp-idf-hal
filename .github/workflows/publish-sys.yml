name: Publish (esp-idf-sys)

on:
  workflow_dispatch

env:
  rust_toolchain: nightly
  crate_name: esp-idf-sys

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v3

      - name: Setup | Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src

      - name: Login
        run: cargo login ${{ secrets.crates_io_token }}

      - name: Build | Publish
        run: export ESP_IDF_TOOLS_INSTALL_DIR=out; cargo publish -p esp-idf-sys --target riscv32imc-esp-espidf -Zbuild-std=std,panic_abort

      - name: Build Documentation
        run: cargo doc -p esp-idf-sys --features native --target riscv32imc-esp-espidf -Zbuild-std=std,panic_abort; echo "<meta http-equiv=\"refresh\" content=\"0; url=esp_idf_sys\">" > target/riscv32imc-esp-espidf/doc/index.html; mv target/riscv32imc-esp-espidf/doc ./docs

      - name: Deploy Documentation
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: esp-idf-sys

      - name: Get the crate version from cargo
        run: |
          version=$(cargo metadata --format-version=1 --no-deps | jq -r ".packages[] | select(.name == \"${{env.crate_name}}\") | .version")
          echo "crate_version=$version" >> $GITHUB_ENV
          echo "${{env.crate_name}} version: $version"

      - name: Tag the new release
        uses: rickstaa/action-create-tag@v1
        with:
          tag: esp-idf-sys-v${{env.crate_version}}
          message: "Release esp-idf-sys v${{env.crate_version}}"
